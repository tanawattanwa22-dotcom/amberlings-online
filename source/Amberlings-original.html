const AU={ctx:null,on:true,m:null,song:null,tm:null,next:0,step:0};
function audioInit(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}

function playSong(n,force){
  if(AU.song===n&&!force)return;AU.song=n;clearInterval(AU.tm);if(!AU.ctx||!n)return;

    const box=el('div','win menu '+(o.cls||''));if(o.style)Object.assign(box.style,o.style);
    if(o.title)el('div','mt',o.title,box);
    const wrap=el('div','ml',null,box);if(o.max)wrap.style.maxHeight=Math.round(o.max*1.5)+'px';
    const n=items.length;let cur=clamp(o.start||0,0,n-1);
    if(o.cancel!==false&&!o.nobk&&!o.cols){const bk=el('div','bkb','◀ ย้อนกลับ',box);if(o.style&&o.style.top!=null&&o.style.bottom==null)bk.classList.add('dn');bk.onclick=e=>{e.stopPropagation();sfx('mv');fin(null)}}
    const rows=items.map((it,i)=>{const r=el('div','opt'+(it.off?' off':''),`<b>▶</b><span class="l">${it.label}</span><span class="s">${it.sub||''}</span>`,wrap);
      r.onclick=()=>{cur=i;draw();pick()};return r});
    function draw(){rows.forEach((r,i)=>r.classList.toggle('on',i===cur));const r=rows[cur];if(r){
        if(r.offsetTop<wrap.scrollTop)wrap.scrollTop=r.offsetTop;else if(r.offsetTop+r.offsetHeight>wrap.scrollTop+wrap.clientHeight)wrap.scrollTop=r.offsetTop+r.offsetHeight-wrap.clientHeight}
      if(o.onMove)o.onMove(items[cur],cur,box)}
    function fin(v){close();if(!o.keep)box.remove();res(v)}
    function pick(){const it=items[cur];if(it.off&&!o.allowOff){sfx('no');return}sfx('ok');fin(it.val!==undefined?it.val:cur)}
    const close=layer(b=>{
      const cs=o.cols||1;
      if(b==='up'&&n){cur=(cur-cs+n)%n;sfx('mv');draw()}else if(b==='down'&&n){cur=(cur+cs)%n;sfx('mv');draw()}
      else if(b==='left'&&cs>1&&n){cur=(cur-1+n)%n;sfx('mv');draw()}else if(b==='right'&&cs>1&&n){cur=(cur+1)%n;sfx('mv');draw()}
      else if(b==='a'&&n)pick();else if(b==='b'&&o.cancel!==false){sfx('mv');fin(null)}
      else if(o.onKey)o.onKey(b,items[cur],cur)});
    if(!n){close();box.remove();res(null);return}draw();
  });
}

      for(let i=0;i<this.vel.length;i++){const v=this.vel[i];a[i*3]+=v[0]*dt+Math.sin(t*1.5+v[3])*.004;a[i*3+1]+=v[1]*dt*(cave?.5:1);a[i*3+2]+=v[2]*dt;
        if(a[i*3+1]<0||a[i*3+1]>9||a[i*3]<cx-13||a[i*3]>cx+13||a[i*3+2]<cz-13||a[i*3+2]>cz+13){a[i*3]=cx+Math.random()*24-12;a[i*3+1]=cave?0:7+Math.random()*2;a[i*3+2]=cz+Math.random()*24-12}}
      pa.needsUpdate=true}
    if(this.rain){const a=this.rain.geometry.attributes.position.array,cx=this.cpos.x,cz=this.cpos.z;
      for(let i=0;i<this.rainN;i++){const o=i*6;a[o+1]-=22*dt;a[o+4]-=22*dt;if(a[o+1]<0){const x=cx+Math.random()*26-13,z=cz+Math.random()*26-13;a[o]=x;a[o+1]=12+Math.random()*3;a[o+2]=z;a[o+3]=x-.05;a[o+4]=a[o+1]+.5;a[o+5]=z}}
      this.rain.geometry.attributes.position.needsUpdate=true}
    for(let i=this.puffs.length-1;i>=0;i--){const p=this.puffs[i];p.t+=dt;p.vy-=7*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;p.m.scale.setScalar(Math.max(.001,.06*(1-p.t/.6)));if(p.t>.6){this.scene.remove(p.m);this.puffs.splice(i,1)}}
    R3.render(this.scene,this.cam);
  }
};

<script>
/* ===== game state, monsters, overworld ===== */

const xpFor=lv=>lv*lv*lv;
function calc(m){const b=SP[m.id][2],lv=m.lv,f=v=>Math.floor(v*2*lv/100)+5;return{hp:Math.floor(b[0]*2*lv/100)+lv+10,atk:f(b[1]),def:f(b[2]),spd:f(b[3])}}

let state=null;

const mySpr=()=>Object.assign({g:state.g,skin:SKINS[state.skin],hair:HAIRS[state.hair],pack:'#8a5a32'},UNIFORMS[state.uni],{hat:state.g==='f'?'none':'cap'},typeof cosSpr==='function'?cosSpr(state.cos):{});
function addMon(m){state.seen[m.id]=1;state.caught[m.id]=1;if(state.party.length<6){state.party.push(m);return'party'}state.box.push(m);return'box'}
const hasReq=r=>r==='starter'?!!state.flags.starter:/^badge\d$/.test(r)?!!state.flags[r]:true;

/* scenes + frame loop */
let SC={cur:null};const FADE={a:0};

function fade(to,ms=300,c){FADE.c=c||'#000';return new Promise(r=>{const a0=FADE.a,t0=performance.now();(function s(){const k=Math.min(1,(performance.now()-t0)/ms);FADE.a=lerp(a0,to,k);if(k<1)requestAnimationFrame(s);else r()})()})}
function banner(text,sub){const b=el('div','win banner',text+(sub?`<small>${sub}</small>`:''));setTimeout(()=>b.remove(),2600)}
css(`.banner{left:50%;top:40px;transform:translateX(-50%);animation:bn 2.6s ease both;font-weight:600;font-size:11px;letter-spacing:.5px;color:var(--amber);padding:5px 10px;text-align:center;white-space:nowrap}.banner small{display:block;font:10px var(--th);color:#f4efe0;margin-top:2px}@keyframes bn{0%{transform:translate(-50%,-30px);opacity:0}12%,80%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-30px);opacity:0}}`);
/* ---- world ---- */

const PARTS=[];
function spawn(o){PARTS.push(Object.assign({life:1,t:0,vx:0,vy:0,g:0,c:'#fff',s:1},o))}
function tintNow(){if(cur.interior||cur.env==='cave')return null;const h=new Date().getHours();
  if(h>=20||h<5)return'rgba(20,24,80,.36)';if(h>=17)return'rgba(255,140,60,.14)';if(h<7)return'rgba(255,170,120,.12)';return null}
SC.world={
  update(dt){

    if(P.mv){const sp=WSPD()*dt,dx=P.tx-P.fx,dy=P.ty-P.fy,d=Math.hypot(dx,dy);
      if(d<=sp){P.fx=P.tx;P.fy=P.ty;P.mv=0;P.step^=1;P.fr=0;arrive()}else{P.fx+=dx/d*sp;P.fy+=dy/d*sp;P.fr=1+((Math.floor(d*2+P.step)&1))}
      return}
    P.fr=0;if(P.hold>0){P.hold-=dt;return}
    const H=Input.held;let d=H.up?'up':H.down?'down':H.left?'left':H.right?'right':null;
    if(!d||Input.stack.length)return;

/* arrival at a tile */

function markers(map,ch){const r=[];map.t.forEach((row,y)=>row.forEach((c,x)=>{if(c===ch)r.push([x,y])}));return r.sort((a,b)=>a[0]-b[0]||a[1]-b[1])}

function waitMove(){return new Promise(r=>{(function w(){if(!P.mv)r();else setTimeout(w,30)})()})}
function npcWalk(n,dir,steps){return new Promise(res=>{let left=steps;const v=DIRV[dir];n.dir=dir;
  (function go(){if(left<=0){n.fr=0;res();return}const tx=n.x+v[0],ty=n.y+v[1];const sp=7*0.016;let k=0;

</script>
<script>
/* ===== battle: rules + flow ===== */
const stageMul=s=>s>=0?(2+s)/2:2/(2-s);
const capLv=()=>[20,30,40,100][badges()];
const msg=(t,ms=700)=>say(t,{auto:ms});
const bname=f=>(f.side==='e'?(B.wild?'มอนป่า ':'ศัตรู '):'')+SP[f.m.id][0];
const spdOf=f=>calc(f.m).spd*(f.m.st==='para'?.5:1);
function dmgCalc(a,d,mk){const[,t,p]=MOVES[mk];const A=calc(a.m),D=calc(d.m);const atk=A.atk*stageMul(a.sg.atk)*(a.m.st==='burn'?.5:1),df=D.def*stageMul(d.sg.def);
  const crit=Math.random()<1/16,stab=SP[a.m.id][1]===t?1.3:1,e=eff(t,SP[d.m.id][1]);
  return{d:Math.max(1,Math.floor(((2*a.m.lv/5+2)*p*atk/df/50+2)*stab*e*(crit?1.5:1)*(.85+Math.random()*.15))),e,crit}}
const monLabel=m=>`<img src="${monIcon(sid(m),14)}" style="width:18px;height:18px;vertical-align:-4px"> ${SP[m.id][0]} <span style="color:#ffb62e;font-size:8px">Lv${m.lv}</span>`;
function partyList(title,o={}){
  const items=state.party.map((m,i)=>({label:monLabel(m),sub:m.hp>0?m.hp+'/'+maxhp(m)+(m.st?' '+ST_TAG[m.st][0]:''):'สลบ',off:o.filter?!o.filter(m,i):false,val:i}));
  return listMenu(items,{title,cancel:o.cancel!==false,style:{left:'8px',right:'8px',top:'70px'},max:150,start:o.start||0})}
async function popIn(f){sfx('orb');if(f.m.shiny)setTimeout(()=>{sfx('caught');burst(f.side,['#fff','#ffe08a','#ffd23f'],46)},300);f.visible=true;for(let i=0;i<=10;i++){f.s=i/10;f.alpha=i/10;f.tint=i<10?'rgba(255,255,255,'+(1-i/10)+')':null;await sleep(26)}f.tint=null;burst(f.side,['#fff','#ffe08a'],14)}
async function faint(f){sfx('faint');for(let i=0;i<10;i++){f.dy=i*3;f.alpha=1-i/10;await sleep(40)}f.visible=false;f.dy=0;f.alpha=1;await msg(bname(f)+' สลบแล้ว!')}
function aiPick(e){
  const us=e.m.moves.filter(x=>x.pp>0);if(!us.length)return{k:'tackle',pp:99};
  if(!B.wild){if(e.m.hp<maxhp(e.m)*.3){const h=us.find(x=>x.k==='heal');if(h&&Math.random()<.5)return h}
    if(Math.random()<.7){let best=null,bs=-1;for(const x of us){const mv=MOVES[x.k];const sc=mv[2]?mv[2]*eff(mv[1],SP[B.pl.m.id][1])*(SP[e.m.id][1]===mv[1]?1.3:1):12;if(sc>bs){bs=sc;best=x}}return best}}
  const w=us.map(x=>MOVES[x.k][2]+15),tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;for(let i=0;i<us.length;i++){r-=w[i];if(r<=0)return us[i]}return us[0]}
async function useMove(att,def,mv){
  const nm=bname(att);
  if(att.m.st==='sleep'){if(att.sleep>0){att.sleep--;await msg(nm+' กำลังหลับอยู่...');return}att.m.st=null;updBox(att);await msg(nm+' ตื่นแล้ว!')}
  if(att.m.st==='para'&&Math.random()<.25){await msg(nm+' ชาจนขยับไม่ได้!');return}
  const M=MOVES[mv.k];mv.pp--;await msg(nm+' ใช้ '+M[0]+'!',500);
  if(Math.random()*100>=M[3]){await msg('แต่พลาดเป้า!');return}
  const fx=M[5]||{};await lunge(att);
  if(!M[2]){
    if(fx.def){att.sg.def=Math.min(6,att.sg.def+1);sfx('heal');popup(att.side,'DEF ↑','#6ab8ff');burst(att.side,'#6ab8ff',20);await msg(nm+' ป้องกันสูงขึ้น!')}
    if(fx.atk){att.sg.atk=Math.min(6,att.sg.atk+1);sfx('heal');popup(att.side,'ATK ↑','#ff8a5a');burst(att.side,'#ff8a5a',20);await msg(nm+' โจมตีแรงขึ้น!')}
    if(fx.heal){const mh=maxhp(att.m);if(att.m.hp>=mh)await msg('แต่ HP เต็มอยู่แล้ว!');else{att.m.hp=Math.min(mh,att.m.hp+Math.ceil(mh*fx.heal));sfx('heal');burst(att.side,['#8affb0','#fff'],26);await animHp(att,att.m.hp);await msg(nm+' ฟื้น HP!')}}
    return}
  vfx(M[1],def.side);await sleep(480);
  const r=dmgCalc(att,def,mv.k);sfx(r.crit?'crit':'hit');
  const dmg=Math.min(r.d,def.m.hp);await hitFlash(def,r.crit);def.m.hp-=dmg;
  popup(def.side,'-'+dmg,r.e>1?'#ffd23f':r.e<1?'#9aa0c8':'#fff');await animHp(def,def.m.hp);
  if(r.crit)await msg('จุดตายเต็มๆ!',500);
  if(r.e>1)await msg('ได้ผลยอดเยี่ยม!',600);else if(r.e<1)await msg('ได้ผลไม่ค่อยดี...',600);
  if(fx.drain&&att.m.hp>0){const mh=maxhp(att.m);att.m.hp=Math.min(mh,att.m.hp+Math.ceil(dmg/2));await animHp(att,att.m.hp)}
  if(def.m.hp>0&&!def.m.st)for(const k of['burn','para','sleep'])if(fx[k]&&Math.random()<fx[k]){def.m.st=k;if(k==='sleep')def.sleep=rnd(1,3);updBox(def);sfx('no');burst(def.side,ST_TAG[k][1],14);await msg(bname(def)+({burn:' ติดไฟลวก!',para:' ถูกไฟช็อตจนชา!',sleep:' หลับไปแล้ว!'})[k]);break}
}
async function endTurn(){
  for(const f of[B.pl,B.en]){if(f.m.hp>0&&f.m.st==='burn'){const d=Math.max(1,Math.floor(maxhp(f.m)/8));f.m.hp=Math.max(0,f.m.hp-d);sfx('fire');popup(f.side,'-'+d,'#ff8a3a');await hitFlash(f,0);await animHp(f,f.m.hp);await msg(bname(f)+' ถูกไฟลวก!',500)}}}
function giveExp(m,amt){const cap=capLv();let up=0;if(m.lv>=cap)return 0;m.exp+=amt;
  while(m.lv<cap&&m.exp>=xpFor(m.lv+1)){const o=maxhp(m);m.lv++;m.hp+=maxhp(m)-o;up++}return up}
async function learnCheck(m,lv){
  for(const[l,k]of learnset(SP[m.id][1])){if(l!==lv||m.moves.some(x=>x.k===k))continue;
    if(m.moves.length<4){m.moves.push({k,pp:MOVES[k][4]});sfx('lvl');await msg(SP[m.id][0]+' เรียนรู้ '+MOVES[k][0]+'!',900)}
    else{await say(SP[m.id][0]+' อยากเรียน '+MOVES[k][0]+' แต่รู้ครบ 4 ท่าแล้ว ลืมท่าเก่าไหม?');
      if(await yesno()){const i=await listMenu(m.moves.map((x,j)=>({label:MOVES[x.k][0],sub:'พลัง '+(MOVES[x.k][2]||'-'),val:j})),{title:'ลืมท่าไหน?',style:{left:'8px',right:'8px',top:'70px'}});
        if(i!=null){const old=m.moves[i].k;m.moves[i]={k,pp:MOVES[k][4]};await msg('ลืม '+MOVES[old][0]+' และเรียน '+MOVES[k][0]+'!',900)}}}}
}
async function expAfterWin(){
  const e=B.en.m,total=Math.floor(SP[e.id][6]*e.lv/7*(B.wild?1:1.5));
  const ps=state.party.filter(m=>B.part.has(m.uid)&&m.hp>0);if(!ps.length)return;const each=Math.max(1,Math.floor(total/ps.length));
  for(const m of ps){
    if(m.lv>=capLv()){if(m===B.pl.m)await msg(SP[m.id][0]+' ถึงขีดสูงสุดของตราที่มีแล้ว (ชนะยิมเพื่อไปต่อ)',900);continue}
    const lv0=m.lv,act=(m===B.pl.m);await msg(SP[m.id][0]+' ได้รับ '+each+' EXP!',600);
    const up=giveExp(m,each);if(act){B.pl.hpShow=m.hp;updBox(B.pl)}
    if(up){sfx('lvl');if(act){burst('p',['#ffe08a','#fff','#8affb0'],50);popup('p','LEVEL UP!','#ffd23f')}await msg(SP[m.id][0]+' เลเวลอัพเป็น Lv'+m.lv+'!',900);
      for(let l=lv0+1;l<=m.lv;l++)await learnCheck(m,l)}}
}
async function sendEnemy(){
  B.en.box&&B.en.box.remove();if(B.en.o)BA.scene.remove(B.en.o);B.en=mkFighter(B.enemies[B.idx],'e');B.en.s=0;B.en.visible=false;boxFor(B.en);state.seen[B.en.m.id]=1;B.part=new Set([B.pl.m.uid]);
  await msg((B.trainer&&B.trainer.name?B.trainer.name+' ':'')+'ส่ง '+SP[B.en.m.id][0]+' ออกมา!',700);await popIn(B.en)}
async function sendPlayer(i){
  const m=state.party[i];B.pl.box&&B.pl.box.remove();if(B.pl.o)BA.scene.remove(B.pl.o);B.pl=mkFighter(m,'p');B.pl.s=0;B.pl.visible=false;boxFor(B.pl);B.part.add(m.uid);
  await msg('ไปเลย '+SP[m.id][0]+'!',600);await popIn(B.pl)}
async function checkFaints(){
  if(B.en.m.hp<=0){await faint(B.en);await expAfterWin();if(B.idx+1<B.enemies.length){B.idx++;await sendEnemy();return'next'}return'win'}
  if(B.pl.m.hp<=0){await faint(B.pl);if(!state.party.some(m=>m.hp>0))return'lose';
    const i=await partyList('ส่งตัวไหนต่อ?',{cancel:false,filter:m=>m.hp>0});await sendPlayer(i);return'next'}
  return null}
const dlgPad=v=>{if(dlgEl)dlgEl.style.paddingRight=v}
async function chooseAction(){
  for(;;){
    await say('จะทำอย่างไรดี ?',{auto:1});await sleep(30);dlgEl.querySelector('.more').style.visibility='hidden';
    dlgEl.style.display='block';
    const c=await listMenu([{label:'สู้',val:'fight'},{label:'กระเป๋า',val:'bag'},{label:'ทีม',val:'team'},{label:'หนี',val:'run'}],{cls:'grid',cols:2,style:{left:'6px',right:'6px',bottom:'6px'},cancel:false});
    if(c==='fight'){
      const hasPP=B.pl.m.moves.some(x=>x.pp>0);if(!hasPP){await msg(SP[B.pl.m.id][0]+' ไม่มี PP เหลือแล้ว! ใช้ท่าสุดท้าย!');return{t:'move',mv:{k:'tackle',pp:99}}}
      const mi=await listMenu(B.pl.m.moves.map((x,i)=>({label:MOVES[x.k][0],sub:'PP '+x.pp+'/'+MOVES[x.k][4],off:x.pp<=0,val:i})),{cls:'grid',cols:2,title:'เลือกท่า',style:{left:'6px',right:'6px',bottom:'6px'},
        onMove:(it,i,box)=>{const mv=MOVES[B.pl.m.moves[i].k],ef=mv[2]?eff(mv[1],SP[B.en.m.id][1]):1;box.querySelector('.mt').innerHTML=`<span style="color:${TYPES[mv[1]][1]}">${TYPES[mv[1]][0]}</span> · พลัง ${mv[2]||'-'} · แม่น ${mv[3]}${ef>1?' · <span style="color:#5fd48a">ได้เปรียบ</span>':ef<1?' · <span style="color:#ff8a8a">เสียเปรียบ</span>':''}`}});
      if(mi!=null)return{t:'move',mv:B.pl.m.moves[mi]}}
    else if(c==='bag'){const r=await battleBag();if(r)return r}
    else if(c==='team'){const i=await partyList('เปลี่ยนตัว',{filter:(m)=>m.hp>0&&m!==B.pl.m});if(i!=null)return{t:'switch',i}}
    else if(c==='run'){if(!B.wild){await msg('หนีจากการดวลกับเทรนเนอร์ไม่ได้!')}else return{t:'run'}}
  }
}
async function battleBag(){
  const items=Object.keys(state.bag).filter(k=>state.bag[k]>0&&ITEMS[k]&&k!=='candy').map(k=>({label:ITEMS[k].n,sub:'×'+state.bag[k],val:k,off:ITEMS[k].k==='orb'&&!B.wild}));
  if(!items.length){await msg('ไม่มีไอเทมใช้ได้');return null}
  const k=await listMenu(items,{title:'กระเป๋า',style:{left:'8px',right:'8px',top:'70px'},max:120,onMove:(it,i,box)=>{box.querySelector('.mt').textContent=ITEMS[it.val].d}});
  if(!k)return null;
  if(ITEMS[k].k==='orb')return{t:'orb',key:k};
  const i=await partyList('ใช้กับตัวไหน?',{});if(i==null)return null;
  const m=state.party[i],before=m.hp,res=applyItem(k,m);if(!res){await msg('ใช้ไม่ได้ผล...');return null}
  state.bag[k]--;return{t:'item',i,res,before,key:k}}
function applyItem(k,m){const it=ITEMS[k];
  if(it.heal){if(m.hp<=0||m.hp>=maxhp(m))return null;m.hp=Math.min(maxhp(m),m.hp+it.heal);return SP[m.id][0]+' ฟื้น HP!'}
  if(it.revive){if(m.hp>0)return null;m.hp=Math.ceil(maxhp(m)/2);m.st=null;return SP[m.id][0]+' ฟื้นคืนชีพ!'}
  if(it.cure){if(!m.st||m.hp<=0)return null;m.st=null;return SP[m.id][0]+' หายผิดปกติแล้ว!'}
  if(it.candy){if(m.lv>=capLv()||m.lv>=100)return null;const o=maxhp(m);m.lv++;m.exp=xpFor(m.lv);m.hp+=maxhp(m)-o;return SP[m.id][0]+' เลเวลอัพเป็น Lv'+m.lv+'!'}
  return null}
async function throwOrb(key){
  const it=ITEMS[key],e=B.en,col={orb:'#ffb62e',silver:'#d8dcec',gold:'#ffd23f'}[key]||'#ffb62e';state.bag[key]--;
  await msg('เธอขว้าง'+it.n+'!',500);
  const orb=buildOrb(col,.32),a=BA.Pp.clone().add(new THREE.Vector3(.5,1.3,-.6)),b=new THREE.Vector3(BA.E.x,BA.E.y+1.4,BA.E.z);orb.position.copy(a);BA.scene.add(orb);
  const gl=glow('#ffe08a',3,0);orb.add(gl);sfx('orb');
  for(let i=0;i<=24;i++){const k=i/24;orb.position.lerpVectors(a,b,k);orb.position.y+=Math.sin(k*Math.PI)*2.4;orb.rotation.z=k*14;await sleep(26)}
  for(let i=0;i<=10;i++){e.s=1-i/10;e.tint='rgba(255,255,255,.9)';e.alpha=1-i/12;await sleep(30)}e.visible=false;e.tint=null;sfx('click');
  const mh=maxhp(e.m),st=e.m.st==='sleep'||e.m.st==='para'?1.5:e.m.st?1.3:1;
  const aa=(3*mh-2*e.m.hp)*SP[e.m.id][5]*it.rate*st/(3*mh),p=clamp(aa/255,.02,1),ok=B.legend?Math.random()<Math.min(.5,p*3):Math.random()<p;
  const shakes=ok?3:rnd(0,2);
  const y0=orb.position.y,rest=BA.E.y+.34;
  for(let i=0;i<=8;i++){orb.position.y=lerp(y0,rest,i/8);await sleep(28)}
  for(let i=0;i<shakes;i++){await sleep(350);sfx('click');for(const r of[.4,-.4,0]){orb.rotation.z=r;await sleep(70)}}
  await sleep(350);
  if(ok){gl.material.opacity=.9;sfx('caught');burst('e',['#ffe08a','#fff','#ffb62e'],50);await sleep(700);BA.scene.remove(orb);
    await msg(SP[e.m.id][0]+' ถูกจับได้แล้ว!',800);
    e.m.hp=Math.max(1,e.m.hp);e.m.uid=Math.random().toString(36).slice(2,9);const where=addMon(e.m);
    if(where==='box')await msg(SP[e.m.id][0]+' ถูกส่งเข้ากล่องมอน');
    await showMonCard(e.m.id,true);
    B.part=new Set([B.pl.m.uid]);await expAfterWin();return true}
  sfx('no');BA.scene.remove(orb);e.visible=true;await popIn(e);
  await msg(['โอ๊ะ! มันหลุดออกมา!','เกือบแล้ว!','เกือบจับได้แล้วเชียว!'][shakes]);return false}
async function battle(o){
  playSong('battle');
  for(let i=0;i<3;i++){await fade(.8,70,'#fff');await fade(0,70)}await fade(1,260);
  const first=state.party.find(m=>m.hp>0);if(!first){await fade(0,100);return'lose'}
  await vsSplash(o);
  B={env:bgEnv(),wild:!!o.wild,trainer:o.trainer,enemies:o.enemies,idx:0,shake:0,flash:0,legend:o.legend,part:new Set([first.uid])};BP.length=0;BF.length=0;
  B.pl=mkFighter(first,'p');B.pl.visible=false;B.en=mkFighter(o.enemies[0],'e');B.en.visible=false;state.seen[B.en.m.id]=1;
  BA.setup(B.env);document.body.classList.add('inb');SC.cur=SC.battle;boxFor(B.en);boxFor(B.pl);B.pl.box.style.display='none';await fade(0,300);
  if(o.legend)await msg('แอมเบอรอน (Lv30) ปรากฏตัว!',900);
  else if(B.wild)await msg('มอนป่า '+SP[B.en.m.id][0]+' ปรากฏตัว!',800);
  else await msg((o.trainer&&o.trainer.name||'เทรนเนอร์')+' ท้าดวล!',800);
  B.en.s=0;await popIn(B.en);
  if(!B.wild)await msg((o.trainer&&o.trainer.name?o.trainer.name+' ':'')+'ส่ง '+SP[B.en.m.id][0]+' ออกมา!',600);

  if(res==='lose'&&o.noBlackout)state.party.forEach(healMon);
  if(res==='run'){await msg('หนีสำเร็จ!',500)}
  B.pl.box&&B.pl.box.remove();B.en.box&&B.en.box.remove();hideDlg();document.body.classList.remove('inb');[B.pl,B.en].forEach(f=>{if(f&&f.o)BA.scene.remove(f.o)});

async function battleLoop(){
  for(;;){
    const act=await chooseAction();
    hideDlg();
    const eMv=aiPick(B.en);let order=['p','e'];
    if(act.t==='move'){const pf=spdOf(B.pl),ef=spdOf(B.en);order=(pf>ef||(pf===ef&&Math.random()<.5))?['p','e']:['e','p']}
    let broke=false;
    for(const who of order){
      if(who==='p'){
        if(act.t==='move'){if(B.pl.m.hp>0)await useMove(B.pl,B.en,act.mv)}
        else if(act.t==='switch'){await msg('กลับมา '+SP[B.pl.m.id][0]+'!',500);for(let i=0;i<8;i++){B.pl.s=1-i/8;await sleep(25)}B.pl.visible=false;await sendPlayer(act.i)}
        else if(act.t==='item'){sfx('heal');const m=state.party[act.i];if(m===B.pl.m){burst('p',['#8affb0','#fff'],24);B.pl.hpShow=B.pl.hpShow;await animHp(B.pl,m.hp);updBox(B.pl)}await msg(act.res,600)}
        else if(act.t==='orb'){if(await throwOrb(act.key))return'caught'}
        else if(act.t==='run'){const odds=clamp(.5+(spdOf(B.pl)-spdOf(B.en))*.01,.3,.95);if(Math.random()<odds)return'run';await msg('หนีไม่พ้น!')}
      }else if(B.en.m.hp>0&&B.pl.m.hp>0&&B.pl.visible!==false){await useMove(B.en,B.pl,eMv)}
      const r=await checkFaints();if(r==='win'||r==='lose')return r;if(r==='next'){broke=true;break}
    }

<script>
/* ===== sign-in gate + hero select =====

   ID token must be verified on a server. So the gate talks to Auth.adapter. Plug in
   Auth.adapter={ async signIn(){ return {id,name,email?} } , async signOut(){} } on a real site
